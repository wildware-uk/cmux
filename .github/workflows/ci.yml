name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Integration tests against a real tmux server
        run: go test -tags integration ./...
